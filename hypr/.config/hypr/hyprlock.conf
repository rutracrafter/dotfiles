# hyprlock: blurred wallpaper, clock, date and password field in wal colors.
# Colors and $wallpaper come from the wal template (see ~/.config/wal/templates/hyprlock-colors.conf).
# Shortcuts to clear the password: ESC, Ctrl+U, Ctrl+Backspace

source = /home/lain/.cache/wal/hyprlock-colors.conf

$font = Noto Sans

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# TIME
label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 80
    font_family = $font Light

    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = 18
    font_family = $font

    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    rounding = 12

    inner_color = $surface_container
    outer_color = $outline
    check_color = $primary
    fail_color = $error
    capslock_color = $secondary
    font_color = $on_surface

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}
