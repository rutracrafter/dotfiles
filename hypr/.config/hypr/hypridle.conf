# hypridle: dim -> lock -> screen off -> suspend
# DPMS uses the Lua dispatcher form, since `hyprctl dispatch dpms off` fails with hyprland.lua.

general {
    lock_cmd = pidof hyprlock || hyprlock                                  # avoid starting a second hyprlock
    before_sleep_cmd = loginctl lock-session                               # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'    # wake the screen after resume
}

# 10 min: dim the screen
listener {
    timeout = 600
    on-timeout = brightnessctl -s set 10%    # -s saves the current level
    on-resume = brightnessctl -r             # -r restores it
}

# 15 min: lock
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 20 min: turn the screen off
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
