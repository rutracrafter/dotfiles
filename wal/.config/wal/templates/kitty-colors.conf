# wal's raw colors are often too dark to read on its own background (as low as 1.2:1),
# so ANSI colors keep wal's hues but are lightened: normal 45%, bright 50%.
# color0 is lifted off the background so "black" text/backgrounds stay visible;
# color8 is a muted grey for comments/autosuggestions (wal's is a saturated bg hue).

background {background}
foreground {foreground}
cursor {color14.lighten(20)}
cursor_text_color {background}
selection_background {color14.lighten(20)}
selection_foreground {background}
url_color {color12.lighten(45)}

active_border_color {color14.lighten(20)}
inactive_border_color {background.lighten(25)}
bell_border_color #ff5f5f

tab_bar_background {background}
active_tab_background {color14.lighten(20)}
active_tab_foreground {background}
inactive_tab_background {background.lighten(12)}
inactive_tab_foreground {color7}

color0  {background.lighten(12)}
color1  {color1.lighten(45)}
color2  {color2.lighten(45)}
color3  {color3.lighten(45)}
color4  {color4.lighten(45)}
color5  {color5.lighten(45)}
color6  {color6.lighten(45)}
color7  {color7}

color8  {color7.darken(20)}
color9  {color9.lighten(50)}
color10 {color10.lighten(50)}
color11 {color11.lighten(50)}
color12 {color12.lighten(50)}
color13 {color13.lighten(50)}
color14 {color14.lighten(50)}
color15 {color15}
